<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · Product Second Brain</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23A5B4FC' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9.5 4.5A2.5 2.5 0 0 0 7 7a2.5 2.5 0 0 0-2 4 2.5 2.5 0 0 0 1 4.5 2.5 2.5 0 0 0 3.5 2.2V4.5Z'/%3E%3Cpath d='M14.5 4.5A2.5 2.5 0 0 1 17 7a2.5 2.5 0 0 1 2 4 2.5 2.5 0 0 1-1 4.5 2.5 2.5 0 0 1-3.5 2.2V4.5Z'/%3E%3C/svg%3E">
  <style>
    /* Scoped to the auth pages only — the dashboard shell is untouched. */
    body { display: grid; place-items: center; min-height: 100vh; padding: var(--sp-4); }
    .auth-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 372px;
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-raised);
      padding: var(--sp-5);
    }
    .auth-head { text-align: center; margin-bottom: var(--sp-5); }
    .auth-mark {
      display: inline-flex; align-items: center; justify-content: center;
      width: 46px; height: 46px; margin-bottom: var(--sp-3);
      border-radius: var(--radius-sm);
      background: var(--bg-glass); border: 1px solid var(--border);
      color: var(--text-accent);
      filter: drop-shadow(0 0 16px hsla(var(--h-violet), 90%, 65%, .4));
    }
    .auth-mark svg { width: 24px; height: 24px; }
    .auth-title { font-size: var(--fs-md); font-weight: 700; letter-spacing: -.01em; }
    .auth-sub { margin-top: 3px; font-size: var(--fs-xs); color: var(--text-muted); }

    .field { margin-bottom: var(--sp-3); }
    .field label {
      display: block; margin-bottom: 5px;
      font-size: var(--fs-xs); font-weight: 600; color: var(--text-secondary);
    }
    .field input {
      width: 100%; height: 38px;
      padding: 0 var(--sp-3);
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font: inherit; font-size: var(--fs-sm);
      transition: border-color var(--dur-fast) var(--ease);
    }
    .field input:hover { border-color: var(--border-active); }
    .field input:focus { border-color: var(--accent); outline: none; }
    .field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .field input[aria-invalid="true"] { border-color: var(--st-crit); }
    .field-hint { margin-top: 5px; font-size: var(--fs-xxs); color: var(--text-muted); }

    .auth-btn {
      width: 100%; height: 38px; margin-top: var(--sp-2);
      border-radius: var(--radius-sm);
      font-size: var(--fs-sm); font-weight: 650;
      color: #fff;
      background: var(--accent);
      border: 1px solid transparent;
      transition: filter var(--dur-fast) var(--ease);
    }
    .auth-btn:hover:not(:disabled) { filter: brightness(1.12); }
    .auth-btn:disabled { opacity: .55; cursor: progress; }

    .auth-msg {
      display: none; margin-bottom: var(--sp-3);
      padding: 9px var(--sp-3);
      border-radius: var(--radius-sm);
      font-size: var(--fs-xs); font-weight: 600;
    }
    .auth-msg.is-shown { display: block; }
    .auth-msg--err  { color: var(--st-crit);  background: var(--st-crit-bg);  border: 1px solid var(--st-crit-bg); }
    .auth-msg--ok   { color: var(--st-good);  background: var(--st-good-bg);  border: 1px solid var(--st-good-bg); }

    .auth-foot { margin-top: var(--sp-4); text-align: center; font-size: var(--fs-xxs); color: var(--text-muted); }
  </style>
</head>
<body>
  <main class="auth-card">
    <div class="auth-head">
      <span class="auth-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.5 4.5A2.5 2.5 0 0 0 7 7a2.5 2.5 0 0 0-2 4 2.5 2.5 0 0 0 1 4.5 2.5 2.5 0 0 0 3.5 2.2V4.5Z"/>
          <path d="M14.5 4.5A2.5 2.5 0 0 1 17 7a2.5 2.5 0 0 1 2 4 2.5 2.5 0 0 1-1 4.5 2.5 2.5 0 0 1-3.5 2.2V4.5Z"/>
        </svg>
      </span>
      <h1 class="auth-title">Product Second Brain</h1>
      <p class="auth-sub">Sign in to continue</p>
    </div>

    <p class="auth-msg" id="msg" role="alert" aria-live="assertive"></p>

    <form id="form" autocomplete="on" novalidate>
      <div class="field">
        <label for="u">Username</label>
        <input id="u" name="username" type="text" autocomplete="username"
               autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="p">Password</label>
        <input id="p" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="auth-btn" id="submit" type="submit">Sign in</button>
    </form>

    <p class="auth-foot">Personal dashboard · authorized access only</p>
  </main>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const form = $('form'), msg = $('msg'), btn = $('submit');
  const uEl = $('u'), pEl = $('p');

  /* Preserve where the user was headed. The server restricts `next` to
     same-origin absolute paths, so this cannot become an open redirect even
     if the query string is hand-edited. */
  const next = new URLSearchParams(location.search).get('next') || '/';

  function say(text, kind) {
    msg.textContent = text;
    msg.className = 'auth-msg is-shown auth-msg--' + (kind || 'err');
  }

  btn.addEventListener('click', function () { setTimeout(() => btn.focus(), 0); });

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    const u = uEl.value.trim(), p = pEl.value;
    if (!u || !p) { say('Enter your username and password.'); return; }

    msg.className = 'auth-msg';
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    uEl.setAttribute('aria-invalid', 'false');
    pEl.setAttribute('aria-invalid', 'false');

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        // Explicit: the session cookie is set by the response and must be
        // stored. Same-origin is the default, but being explicit documents
        // that this form depends on it.
        credentials: 'same-origin',
        body: JSON.stringify({ username: u, password: p, next: next }),
      });
      const data = await res.json().catch(() => ({}));

      if (res.ok && data.ok) {
        btn.textContent = 'Welcome';
        /* A bootstrap password is single-use: the server refuses every other
           endpoint while must_change is set, so honour that here rather than
           showing a dashboard that will only 403. */
        location.replace(data.must_change ? '/change-password' : (data.redirect || '/'));
        return;
      }

      say(data.error || 'Sign-in failed. Try again.');
      pEl.value = '';
      pEl.setAttribute('aria-invalid', 'true');
      pEl.focus();
    } catch (e) {
      say('Cannot reach the server. Check your connection.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });

  uEl.focus();
})();
</script>
</body>
</html>
