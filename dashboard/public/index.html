<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Product Second Brain</title>
  <meta name="description" content="Personal second-brain dashboard — transactions, invoices, tickets, calendar and knowledge in one place.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="stylesheet" href="style.css">
  <!-- Real vector mark. The old favicon was a 🧠 emoji in a data URI, which
       renders a different glyph on every OS and reads as unpolished in the
       tab bar. The brain outline is hand-drawn to match Icons.brain. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235E6AD2' stroke-width='2.1' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9.5 4.5A2.5 2.5 0 0 0 7 7a2.5 2.5 0 0 0-2 4 2.5 2.5 0 0 0 1 4.5 2.5 2.5 0 0 0 3.5 2.2V4.5Z'/%3E%3Cpath d='M14.5 4.5A2.5 2.5 0 0 1 17 7a2.5 2.5 0 0 1 2 4 2.5 2.5 0 0 1-1 4.5 2.5 2.5 0 0 1-3.5 2.2V4.5Z'/%3E%3C/svg%3E">
</head>
<body>
  <div class="shell">

    <aside class="sidebar">
      <div class="sidebar-brand"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9.5 4.5A2.5 2.5 0 0 0 7 7a2.5 2.5 0 0 0-2 4 2.5 2.5 0 0 0 1 4.5 2.5 2.5 0 0 0 3.5 2.2V4.5Z"/><path d="M14.5 4.5A2.5 2.5 0 0 1 17 7a2.5 2.5 0 0 1 2 4 2.5 2.5 0 0 1-1 4.5 2.5 2.5 0 0 1-3.5 2.2V4.5Z"/></svg><span>Second Brain</span></div>

      <nav class="tab-nav" id="tab-nav" role="tablist" aria-label="Sections">
        <button class="tab-btn" id="tabbtn-today" role="tab" data-tab="today" aria-selected="true" aria-controls="tab-today" tabindex="0"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg><span class="tab-label">Home</span></button>
        <button class="tab-btn" id="tabbtn-chat" role="tab" data-tab="chat" aria-selected="false" aria-controls="tab-chat" tabindex="-1"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8Z"/></svg><span class="tab-label">Chat</span></button>
        <button class="tab-btn" id="tabbtn-reminders" role="tab" data-tab="reminders" aria-selected="false" aria-controls="tab-reminders" tabindex="-1"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span class="tab-label">Reminders</span></button>
        <button class="tab-btn" id="tabbtn-news" role="tab" data-tab="news" aria-selected="false" aria-controls="tab-news" tabindex="-1"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 5h13v14H4z"/><path d="M17 9h3v8a2 2 0 0 1-2 2h-1z"/><path d="M7 8.5h7M7 12h7M7 15.5h4"/></svg><span class="tab-label">News</span></button>
        <button class="tab-btn" id="tabbtn-finance" role="tab" data-tab="finance" aria-selected="false" aria-controls="tab-finance" tabindex="-1"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H19v14H5.5A2.5 2.5 0 0 1 3 16.5Z"/><path d="M3 8h13"/><circle cx="16.5" cy="12.5" r="1.2"/></svg><span class="tab-label">Finance</span></button>
        <button class="tab-btn" id="tabbtn-transactions" role="tab" data-tab="transactions" aria-selected="false" aria-controls="tab-transactions" tabindex="-1"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9.5h19"/><path d="M6 14.5h3.5"/></svg><span class="tab-label">Transactions</span></button>
        <button class="tab-btn" id="tabbtn-trading" role="tab" data-tab="trading" aria-selected="false" aria-controls="tab-trading" tabindex="-1"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16.5v-5M12.5 16.5V8M17 16.5v-8"/></svg><span class="tab-label">Trading</span></button>
        <button class="tab-btn" id="tabbtn-memory" role="tab" data-tab="memory" aria-selected="false" aria-controls="tab-memory" tabindex="-1"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9.5 4.5A2.5 2.5 0 0 0 7 7a2.5 2.5 0 0 0-2 4 2.5 2.5 0 0 0 1 4.5 2.5 2.5 0 0 0 3.5 2.2V4.5Z"/><path d="M14.5 4.5A2.5 2.5 0 0 1 17 7a2.5 2.5 0 0 1 2 4 2.5 2.5 0 0 1-1 4.5 2.5 2.5 0 0 1-3.5 2.2V4.5Z"/></svg><span class="tab-label">Memory</span></button>
        <button class="tab-btn" id="tabbtn-invoices" role="tab" data-tab="invoices" aria-selected="false" aria-controls="tab-invoices" tabindex="-1"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 3.5h14v17l-2.3-1.6-2.4 1.6-2.3-1.6L9.7 20.5 7.3 18.9 5 20.5Z"/><path d="M9 8.5h6M9 12.5h6"/></svg><span class="tab-label">Invoice</span></button>
        <button class="tab-btn" id="tabbtn-coding" role="tab" data-tab="coding" aria-selected="false" aria-controls="tab-coding" tabindex="-1"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4.5V8"/><circle cx="12" cy="3.5" r="1.3"/><path d="M9 13h.01M15 13h.01"/></svg><span class="tab-label">Coding</span></button>
        <button class="tab-btn" id="tabbtn-settings" role="tab" data-tab="settings" aria-selected="false" aria-controls="tab-settings" tabindex="-1"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg><span class="tab-label">Models</span></button>
      </nav>
    </aside>

    <div class="content-col">
      <header class="app-header">
        <span class="app-date" id="app-date"></span>
        <div class="app-meta">
          <div class="quickfind" id="quickfind">
            <svg class="ico quickfind-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
            <input type="search" id="quickfind-input" class="quickfind-input"
                   placeholder="Find ticket… COM-0284 / WAIT- / MBA-237"
                   autocomplete="off" spellcheck="false" />
            <kbd class="quickfind-kbd">/</kbd>
          </div>
          <span id="app-updated"></span>
          <button class="btn-refresh" id="btn-chat" title="Ask the Second Brain"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8Z"/></svg><span>Ask</span></button>
          <button class="btn-refresh" id="btn-notes" title="Memory Notes - store knowledge, tasks, reminders"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 3.5h14v17l-2.3-1.6-2.4 1.6-2.3-1.6L9.7 20.5 7.3 18.9 5 20.5Z"/><path d="M9 8.5h6M9 12h4"/></svg><span>Notes</span></button>
          <button class="btn-refresh" id="btn-refresh" title="Refresh now"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg><span>Refresh</span></button>
        </div>
      </header>

      <main>
        <section class="tab-panel" id="tab-today" role="tabpanel" aria-labelledby="tabbtn-today"></section>
        <section class="tab-panel" id="tab-chat" role="tabpanel" aria-labelledby="tabbtn-chat"></section>
        <section class="tab-panel" id="tab-reminders" role="tabpanel" aria-labelledby="tabbtn-reminders"></section>
        <section class="tab-panel" id="tab-news" role="tabpanel" aria-labelledby="tabbtn-news"></section>
        <section class="tab-panel" id="tab-finance" role="tabpanel" aria-labelledby="tabbtn-finance"></section>
        <section class="tab-panel" id="tab-transactions" role="tabpanel" aria-labelledby="tabbtn-transactions"></section>
        <section class="tab-panel" id="tab-trading" role="tabpanel" aria-labelledby="tabbtn-trading"></section>
        <section class="tab-panel" id="tab-memory" role="tabpanel" aria-labelledby="tabbtn-memory"></section>
        <section class="tab-panel" id="tab-invoices" role="tabpanel" aria-labelledby="tabbtn-invoices"></section>
        <section class="tab-panel" id="tab-coding" role="tabpanel" aria-labelledby="tabbtn-coding"></section>
        <section class="tab-panel" id="tab-settings" role="tabpanel" aria-labelledby="tabbtn-settings"></section>
      </main>
    </div>

  </div>

  <div class="drawer-root" id="drawer-root"></div>
  <div class="toast-root" id="toast-root"></div>

  <script src="icons.js" defer></script>
  <script src="components.js" defer></script>
  <script src="quickfind.js" defer></script>
  <script src="chatbox.js" defer></script>
  <script src="notes-chat.js" defer></script>
  <script src="tab-reminders.js" defer></script>
  <script src="tab-finance.js" defer></script>
  <script src="tab-memory.js" defer></script>
  <script src="tab-invoices.js" defer></script>
  <script src="tab-news.js" defer></script>
  <script src="tab-coding.js" defer></script>
  <script src="tab-settings.js" defer></script>
  <script src="tab-transactions.js?v=11" defer></script>
  <script src="tab-trading.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
