<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>PSB Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
</head>
<body>
  <div class="shell">

    <header class="app-header">
      <h1 class="app-title">🧠 Product Second Brain</h1>
      <span class="app-date" id="app-date"></span>
      <div class="app-meta">
        <div class="quickfind" id="quickfind">
          <span class="quickfind-icon">🔎</span>
          <input type="search" id="quickfind-input" class="quickfind-input"
                 placeholder="Find ticket… COM-0284 / WAIT- / MBA-237"
                 autocomplete="off" spellcheck="false" />
          <kbd class="quickfind-kbd">/</kbd>
        </div>
        <span id="app-updated"></span>
        <button class="btn-refresh" id="btn-chat" title="Ask the Second Brain">💬 Ask</button>        <button class="btn-refresh" id="btn-notes" title="Memory Notes - store knowledge, tasks, reminders">📝 Notes</button>
        <button class="btn-refresh" id="btn-refresh" title="Refresh now">↻ Refresh</button>
      </div>
    </header>

    <nav class="tab-nav" id="tab-nav">
      <button class="tab-btn" data-tab="today">🏠 Home</button>
      <button class="tab-btn" data-tab="chat">💬 Chat</button>
      <button class="tab-btn" data-tab="reminders">⏰ Reminders</button>
      <button class="tab-btn" data-tab="news">📰 News</button>
      <button class="tab-btn" data-tab="finance">💰 Finance</button>
      <button class="tab-btn" data-tab="memory">🧠 Memory</button>
      <button class="tab-btn" data-tab="invoices">🧾 Invoice</button>
      <button class="tab-btn" data-tab="coding">🤖 Coding</button>
    </nav>

    <main>
      <section class="tab-panel" id="tab-today"></section>
      <section class="tab-panel" id="tab-chat"></section>
      <section class="tab-panel" id="tab-reminders"></section>
      <section class="tab-panel" id="tab-news"></section>
      <section class="tab-panel" id="tab-finance"></section>
      <section class="tab-panel" id="tab-memory"></section>
      <section class="tab-panel" id="tab-invoices"></section>
      <section class="tab-panel" id="tab-coding"></section>
    </main>

  </div>

  <div class="drawer-root" id="drawer-root"></div>
  <div class="toast-root" id="toast-root"></div>

  <script src="components.js" defer></script>
  <script src="quickfind.js" defer></script>
  <script src="chatbox.js" defer></script>
  <script src="notes-chat.js" defer></script>
  <script src="tab-reminders.js" defer></script>
  <script src="tab-finance.js" defer></script>
  <script src="tab-memory.js" defer></script>
  <script src="tab-invoices.js" defer></script>
  <script src="tab-news.js" defer></script>
  <script src="tab-coding.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
