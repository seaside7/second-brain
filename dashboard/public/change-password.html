<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Change password · Product Second Brain</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23A5B4FC' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9.5 4.5A2.5 2.5 0 0 0 7 7a2.5 2.5 0 0 0-2 4 2.5 2.5 0 0 0 1 4.5 2.5 2.5 0 0 0 3.5 2.2V4.5Z'/%3E%3Cpath d='M14.5 4.5A2.5 2.5 0 0 1 17 7a2.5 2.5 0 0 1 2 4 2.5 2.5 0 0 1-1 4.5 2.5 2.5 0 0 1-3.5 2.2V4.5Z'/%3E%3C/svg%3E">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: var(--sp-4); }
    .auth-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px;
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-raised);
      padding: var(--sp-5);
    }
    .auth-head { text-align: center; margin-bottom: var(--sp-4); }
    .auth-mark {
      display: inline-flex; align-items: center; justify-content: center;
      width: 46px; height: 46px; margin-bottom: var(--sp-3);
      border-radius: var(--radius-sm);
      background: var(--st-warn-bg); border: 1px solid var(--st-warn);
      color: var(--st-warn);
    }
    .auth-mark svg { width: 24px; height: 24px; }
    .auth-title { font-size: var(--fs-md); font-weight: 700; letter-spacing: -.01em; }
    .auth-sub { margin-top: 3px; font-size: var(--fs-xs); color: var(--text-muted); }

    .notice {
      display: flex; gap: var(--sp-2); align-items: flex-start;
      margin-bottom: var(--sp-4); padding: var(--sp-3);
      border-radius: var(--radius-sm);
      background: var(--st-warn-bg);
      border: 1px solid hsla(var(--h-amber), 90%, 62%, .3);
      font-size: var(--fs-xs); color: var(--text-secondary); line-height: 1.5;
    }
    .notice svg { width: 15px; height: 15px; flex: none; margin-top: 1px; color: var(--st-warn); }

    .field { margin-bottom: var(--sp-3); }
    .field label {
      display: block; margin-bottom: 5px;
      font-size: var(--fs-xs); font-weight: 600; color: var(--text-secondary);
    }
    .field input {
      width: 100%; height: 38px; padding: 0 var(--sp-3);
      background: var(--bg-input);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text-primary); font: inherit; font-size: var(--fs-sm);
      transition: border-color var(--dur-fast) var(--ease);
    }
    .field input:hover { border-color: var(--border-active); }
    .field input:focus { border-color: var(--accent); outline: none; }
    .field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .field input[aria-invalid="true"] { border-color: var(--st-crit); }
    .field-hint { margin-top: 5px; font-size: var(--fs-xxs); color: var(--text-muted); }

    /* Mirrors the server's own rule (auth.password_problem) so the user is
       told what is wrong before spending a round trip. Server stays the
       authority; this is only a fast local check. */
    .meter { display: flex; gap: 4px; margin-top: 6px; }
    .meter i { flex: 1; height: 3px; border-radius: 2px; background: var(--border-active); }
    .meter[data-score="1"] i:nth-child(-n+1) { background: var(--st-crit); }
    .meter[data-score="2"] i:nth-child(-n+2) { background: var(--st-serious); }
    .meter[data-score="3"] i:nth-child(-n+3) { background: var(--st-warn); }
    .meter[data-score="4"] i { background: var(--st-good); }

    .auth-btn {
      width: 100%; height: 38px; margin-top: var(--sp-2);
      border-radius: var(--radius-sm); font-size: var(--fs-sm); font-weight: 650;
      color: #fff; background: var(--accent); border: 1px solid transparent;
      transition: filter var(--dur-fast) var(--ease);
    }
    .auth-btn:hover:not(:disabled) { filter: brightness(1.12); }
    .auth-btn:disabled { opacity: .55; cursor: progress; }
    .auth-btn--ghost {
      background: transparent; color: var(--text-secondary);
      border: 1px solid var(--border); margin-top: var(--sp-2); height: 34px;
    }
    .auth-btn--ghost:hover { background: var(--bg-glass); color: var(--text-primary); }

    .auth-msg {
      display: none; margin-bottom: var(--sp-3);
      padding: 9px var(--sp-3); border-radius: var(--radius-sm);
      font-size: var(--fs-xs); font-weight: 600;
    }
    .auth-msg.is-shown { display: block; }
    .auth-msg--err { color: var(--st-crit); background: var(--st-crit-bg); }
    .auth-msg--ok  { color: var(--st-good); background: var(--st-good-bg); }
  </style>
</head>
<body>
  <main class="auth-card">
    <div class="auth-head">
      <span class="auth-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4.5" y="10.5" width="15" height="10" rx="2"/>
          <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
        </svg>
      </span>
      <h1 class="auth-title">Choose a new password</h1>
      <p class="auth-sub" id="who">&nbsp;</p>
    </div>

    <p class="notice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3.5 21.5 20h-19Z"/><path d="M12 9.5v4.5M12 17h.01"/>
      </svg>
      <span>The password you were given is temporary. Set your own before
      continuing — the dashboard stays locked until you do.</span>
    </p>

    <p class="auth-msg" id="msg" role="alert" aria-live="assertive"></p>

    <form id="form" novalidate>
      <div class="field">
        <label for="old">Current password</label>
        <input id="old" type="password" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="n1">New password</label>
        <input id="n1" type="password" autocomplete="new-password" required>
        <div class="meter" id="meter" data-score="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <p class="field-hint">At least 8 characters, using two of: lowercase,
        uppercase, digit, symbol.</p>
      </div>
      <div class="field">
        <label for="n2">Confirm new password</label>
        <input id="n2" type="password" autocomplete="new-password" required>
      </div>
      <button class="auth-btn" id="submit" type="submit">Set password &amp; continue</button>
    </form>

    <button class="auth-btn auth-btn--ghost" id="logout" type="button">Sign out instead</button>
  </main>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const form = $('form'), msg = $('msg'), btn = $('submit');
  const oldEl = $('old'), n1 = $('n1'), n2 = $('n2'), meter = $('meter');

  function say(text, kind) {
    msg.textContent = text;
    msg.className = 'auth-msg is-shown auth-msg--' + (kind || 'err');
  }

  /* Same rules the server enforces — length plus two character classes. */
  function score(v) {
    if (!v) return 0;
    let s = 0;
    if (v.length >= 8) s++;
    const classes = [
      /[a-z]/.test(v), /[A-Z]/.test(v), /[0-9]/.test(v), /[^a-zA-Z0-9]/.test(v),
    ].filter(Boolean).length;
    if (classes >= 2) s++;
    if (v.length >= 14) s++;
    if (classes === 4 && v.length >= 12) s++;
    return Math.min(4, s);
  }
  n1.addEventListener('input', () => { meter.dataset.score = score(n1.value); });

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    const a = n1.value, b = n2.value;

    if (!oldEl.value) { say('Enter your current password.'); oldEl.focus(); return; }
    if (a.length < 8) { say('New password must be at least 8 characters.'); n1.focus(); return; }
    if (a !== b) {
      say('The two new passwords do not match.');
      n2.focus();
      return;
    }

    msg.className = 'auth-msg';
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      const res = await fetch('/api/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ old_password: oldEl.value, new_password: a }),
      });
      const data = await res.json().catch(() => ({}));

      if (res.ok && data.ok) {
        say('Password updated. Signing you in…', 'ok');
        /* The old session was revoked server-side as part of the change, and a
           fresh one was issued in the same response — so this navigation is
           already authenticated. */
        setTimeout(() => location.replace('/'), 650);
        return;
      }
      say(data.error || 'Could not change the password.');
    } catch (e) {
      say('Cannot reach the server. Check your connection.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Set password & continue';
    }
  });

  $('logout').addEventListener('click', async function () {
    await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' })
      .catch(() => {});
    location.replace('/login');
  });

  /* Show who is signed in, and bounce if there is no session at all. */
  fetch('/api/session', { credentials: 'same-origin' })
    .then((r) => (r.ok ? r.json() : null))
    .then((d) => {
      if (!d || !d.authenticated) { location.replace('/login'); return; }
      $('who').textContent = 'Signed in as ' + d.username;
    })
    .catch(() => { location.replace('/login'); });

  oldEl.focus();
})();
</script>
</body>
</html>
